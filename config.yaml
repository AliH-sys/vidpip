media_root: ./media
log_dir: ./logs
poll_seconds: 5
retry:
  max_attempts: 3
  backoff_seconds: 30
downloader:
  enabled: true
  urls: []
  target_count: 10
  format: bestvideo[height<=1080]+bestaudio/best[height<=1080]
  max_video_uses: 3
  prune_over_target: true
stories:
  enabled: true
  pending_target: 4
  model: story-local
  temperature: 0.9
  max_tokens: 1800
  topics:
  - an unexpected encounter
  prompts:
    male: Write a compelling short story from a male perspective about {topic}.
    female: Write a compelling short story from a female perspective about {topic}.
  providers:
    story-local:
      type: ollama
      base_url: http://localhost:11434/v1
      model: llama3.1
      api_key_env: OLLAMA_API_KEY
    story-cloud:
      type: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini
    story-local-openai:
      type: openai_compatible
      base_url: http://localhost:8000/v1
      model: local-model
      api_key_env: LOCAL_LLM_API_KEY
    gemini:
      type: openai_compatible
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.0-flash
      api_key_env: GEMINI_API_KEY
    mistral:
      type: openai_compatible
      base_url: https://api.mistral.ai/v1
      model: mistral-small-latest
      api_key_env: MISTRAL_API_KEY
    groq:
      type: openai_compatible
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api_key_env: GROQ_API_KEY
    nvidia-nim:
      type: openai_compatible
      base_url: https://integrate.api.nvidia.com/v1
      model: meta/llama-3.1-70b-instruct
      api_key_env: NVIDIA_NIM_API_KEY
    zai:
      type: openai_compatible
      base_url: https://api.z.ai/api/paas/v4
      model: glm-4.5-air
      api_key_env: ZAI_API_KEY
tts:
  enabled: true
  mode: kokoro
  male_voice: am_michael
  female_voice: af_heart
  speed: 1.0
  model: tts-cloud
  providers:
    tts-cloud:
      type: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini-tts
subtitles:
  enabled: true
  mode: faster_whisper
  model: small
  device: auto
  compute_type: int8
  language: en
  providers:
    subtitle-cloud:
      type: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: whisper-1
  style: Default
composer:
  enabled: true
  ffmpeg: ffmpeg
  output_width: 1080
  output_height: 1920
  fps: 30
  subtitle_style: Default
  preset: medium
  crf: 20
tui:
  refresh_seconds: 1
  log_lines: 200
